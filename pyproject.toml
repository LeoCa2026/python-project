[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-project"
version = "0.1.0"
description = "A basic Python project with a command-line example."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
python-project = "python_project.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
